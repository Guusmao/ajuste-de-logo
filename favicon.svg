<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="64" height="64" rx="12" fill="url(#rulerGrad)"/>

  <!-- Régua inclinada -->
  <g transform="translate(32, 32) rotate(-45)">
    <!-- Corpo da régua -->
    <rect x="-24" y="-6" width="48" height="12" rx="2" fill="white" opacity="0.95"/>

    <!-- Marcas principais (cm) -->
    <line x1="-20" y1="-7" x2="-20" y2="-10" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="-10" y1="-7" x2="-10" y2="-10" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="0" y1="-7" x2="0" y2="-10" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="10" y1="-7" x2="10" y2="-10" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="20" y1="-7" x2="20" y2="-10" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Marcas menores -->
    <line x1="-15" y1="-7" x2="-15" y2="-8.5" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    <line x1="-5" y1="-7" x2="-5" y2="-8.5" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="-7" x2="5" y2="-8.5" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="-7" x2="15" y2="-8.5" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>

    <!-- Número na régua -->
    <text x="0" y="3" font-size="6" font-weight="bold" fill="#3b82f6" text-anchor="middle">cm</text>
  </g>
</svg>