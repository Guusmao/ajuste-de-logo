<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e5e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rulerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rulerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- Régua inclinada -->
  <g transform="translate(32, 32) rotate(-45)">
    <!-- Lado azul da régua -->
    <rect x="-24" y="-6" width="24" height="12" rx="2" fill="url(#rulerBlue)"/>
    <!-- Lado verde da régua -->
    <rect x="0" y="-6" width="24" height="12" rx="2" fill="url(#rulerGreen)"/>

    <!-- Marcas principais -->
    <line x1="-20" y1="-7" x2="-20" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="-10" y1="-7" x2="-10" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-7" x2="0" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="10" y1="-7" x2="10" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="20" y1="-7" x2="20" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>

    <!-- Marcas menores -->
    <line x1="-15" y1="-7" x2="-15" y2="-8.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="-5" y1="-7" x2="-5" y2="-8.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="-7" x2="5" y2="-8.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="15" y1="-7" x2="15" y2="-8.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>