<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo gradiente -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- Frame/Quadro central -->
  <rect x="10" y="10" width="44" height="44" rx="6" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Logo esquerda (azul) -->
  <circle cx="20" cy="32" r="8" fill="white" opacity="0.9"/>
  <text x="20" y="36" font-size="10" font-weight="bold" fill="url(#bgGrad)" text-anchor="middle" font-family="Arial">L</text>

  <!-- Logo direita (verde) -->
  <circle cx="44" cy="32" r="8" fill="url(#accentGrad)"/>
  <text x="44" y="36" font-size="10" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">✓</text>

  <!-- Símbolos de ajuste (reticências nos cantos) -->
  <circle cx="14" cy="14" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="18" cy="14" r="1.5" fill="white" opacity="0.6"/>

  <circle cx="46" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="50" cy="50" r="1.5" fill="white" opacity="0.6"/>

  <!-- Setas de redimensionamento (sugestão de escala) -->
  <g stroke="white" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="10" y1="22" x2="10" y2="42" stroke-linecap="round"/>
    <line x1="54" y1="22" x2="54" y2="42" stroke-linecap="round"/>
  </g>
</svg>