<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rulerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4d03f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Régua inclinada -->
  <g transform="translate(32, 32) rotate(-45)">
    <!-- Corpo da régua (preto) -->
    <rect x="-24" y="-6" width="48" height="12" rx="2" fill="#1a1a1a" stroke="url(#rulerGold)" stroke-width="1.5"/>

    <!-- Marcas principais (dourado) -->
    <line x1="-20" y1="-7" x2="-20" y2="-10" stroke="url(#rulerGold)" stroke-width="1.5"/>
    <line x1="-10" y1="-7" x2="-10" y2="-10" stroke="url(#rulerGold)" stroke-width="1.5"/>
    <line x1="0" y1="-7" x2="0" y2="-10" stroke="url(#rulerGold)" stroke-width="1.5"/>
    <line x1="10" y1="-7" x2="10" y2="-10" stroke="url(#rulerGold)" stroke-width="1.5"/>
    <line x1="20" y1="-7" x2="20" y2="-10" stroke="url(#rulerGold)" stroke-width="1.5"/>

    <!-- Marcas menores -->
    <line x1="-15" y1="-7" x2="-15" y2="-8.5" stroke="url(#rulerGold)" stroke-width="1" opacity="0.7"/>
    <line x1="-5" y1="-7" x2="-5" y2="-8.5" stroke="url(#rulerGold)" stroke-width="1" opacity="0.7"/>
    <line x1="5" y1="-7" x2="5" y2="-8.5" stroke="url(#rulerGold)" stroke-width="1" opacity="0.7"/>
    <line x1="15" y1="-7" x2="15" y2="-8.5" stroke="url(#rulerGold)" stroke-width="1" opacity="0.7"/>
  </g>
</svg>